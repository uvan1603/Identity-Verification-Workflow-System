version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: identity_verification_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: identity_verification
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d identity_verification"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - identity_verification_network

  redis:
    image: redis:7-alpine
    container_name: identity_verification_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - identity_verification_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: identity_verification_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://user:password@postgres:5432/identity_verification
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_key_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_key_change_in_production}
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    networks:
      - identity_verification_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  identity_verification_network:
    driver: bridge
